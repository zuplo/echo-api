name: Build & Release
on: [push]

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    permissions:
      contents: "read"
      packages: "read"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: "npm"

      - run: npm install
        env:
          GITHUB_NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build
        env:
          GIT_SHA: ${{ github.sha }}
          API_VERSION: ${{ github.run_id }}

      - run: npm run lint
