# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
# Private @zuplo/* packages on npm.pkg.github.com need no `registries` entry:
# Dependabot reads GitHub Packages with its own GITHUB_TOKEN once each package
# grants this repository read access (Package settings > Manage Actions
# access).

updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
